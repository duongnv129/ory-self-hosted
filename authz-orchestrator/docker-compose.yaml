services:
  authz-orchestrator:
    build: .
    container_name: authz-orchestrator
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - KETO_READ_URL=http://keto:4466
      - KETO_WRITE_URL=http://keto:4467
      - OPA_URL=http://opa:8181
      - CONFIG_PATH=/app/config
      - AUTHZ_LOGGING_LEVEL=info
    volumes:
      - ./config:/app/config:ro
      - ./policies:/app/policies:ro
    networks:
      - ory
    depends_on:
      - opa
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  opa:
    image: openpolicyagent/opa:latest
    platform: linux/amd64
    container_name: opa
    ports:
      - "8181:8181"
    command:
      - "run"
      - "--server"
      - "--addr=0.0.0.0:8181"
      - "--log-level=info"
      - "/policies"
    volumes:
      - ./policies:/policies:ro
    networks:
      - ory
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8181/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  ory:
    external: true
    name: ory-network